required-version = "==0.16.7"
target-version = "py312"
force-exclude = true

[format]
# Preserve historical source hashes, fixture bytes, and experiment prompts.
exclude = [
    "experiment/archive_formatters.py",
    "experiment/defective_formatters.py",
    "experiment/prompts.py",
    "tests/builder_fixture.py",
]

[lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "SIM", "C90"]

[lint.per-file-ignores]
# Verbatim historical source: tests verify pinned source hashes.
"experiment/archive_formatters.py" = ["UP006", "UP035", "C901"]
"experiment/defective_formatters.py" = ["UP006", "UP035", "I001"]
# The original builder input fixture is itself hash-checked.
"tests/builder_fixture.py" = ["UP017"]

[lint.mccabe]
max-complexity = 10

[lint.isort]
combine-as-imports = true
